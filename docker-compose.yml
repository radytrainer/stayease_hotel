services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stayease}
      POSTGRES_USER: ${POSTGRES_USER:-stayease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    ports: ["5432:5432"]
    volumes: ["stayease-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stayease}"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-stayease}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-stayease}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
      SPRING_PROFILES_ACTIVE: local
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_API_URL: ${EMAIL_API_URL:-https://api.resend.com/emails}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
      MAX_HTTP_REQUEST_HEADER_SIZE: ${MAX_HTTP_REQUEST_HEADER_SIZE:-32KB}
      KHR_PER_USD: ${KHR_PER_USD:-4067}
      KHR_RATE_PUBLISHED_ON: ${KHR_RATE_PUBLISHED_ON:-2026-10-16}
    depends_on:
      db: {condition: service_healthy}
    ports: ["8080:8080"]
    # Startup (Flyway migrations + Spring) takes ~20-30 s; the web app waits for this before starting.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 24
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    depends_on:
      api: {condition: service_healthy}
    ports: ["3000:3000"]
volumes:
  stayease-data:
