# Production stack for a single server (e.g. one AWS EC2 instance).
# Only Caddy is reachable from outside: it serves the web app on / and the API on /api/.
# Usage: docker compose -f docker-compose.prod.yml up -d --build   (settings come from .env, see deploy/env.production.example)
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stayease}
      POSTGRES_USER: ${POSTGRES_USER:-stayease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["stayease-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stayease}"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-stayease}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-stayease}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Empty = production (no demo data). "local" loads the demo hotels and accounts.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      WEB_ORIGIN: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_API_URL: ${EMAIL_API_URL:-https://api.resend.com/emails}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-southeast-2}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # Caddy overwrites X-Forwarded-For, so sign-in rate limits see the real client address.
      FORWARD_HEADERS_STRATEGY: native
      MAX_HTTP_REQUEST_HEADER_SIZE: ${MAX_HTTP_REQUEST_HEADER_SIZE:-32KB}
      KHR_PER_USD: ${KHR_PER_USD:-4067}
      KHR_RATE_PUBLISHED_ON: ${KHR_RATE_PUBLISHED_ON:-2026-10-16}
      # Leaves room for PostgreSQL and Next.js on a small instance.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=40}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 24
  web:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time; rebuild after changing PUBLIC_URL.
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}/api/v1
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      # ":80" serves plain HTTP on the IP address. Set to a domain name for automatic HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, web]
volumes:
  stayease-data:
  caddy-data:
  caddy-config:
