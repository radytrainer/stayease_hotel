server:
  port: 8080
  # Set to 'native' only behind a trusted proxy that overwrites X-Forwarded-For; sign-in rate limits key on the client address.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  # Browsers send every localhost cookie to every local port; 8 KB (the default) is easily exceeded in development.
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE:32KB}
spring:
  application:
    name: stayease-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stayease}
    username: ${SPRING_DATASOURCE_USERNAME:stayease}
    password: ${SPRING_DATASOURCE_PASSWORD:local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  # Display-only riel conversion. Update from the National Bank of Cambodia's official rate.
  exchange:
    khr-per-usd: ${KHR_PER_USD:4067}
    published-on: ${KHR_RATE_PUBLISHED_ON:2026-10-16}
    source: ${KHR_RATE_SOURCE:National Bank of Cambodia official rate}
  payment:
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  email:
    api-url: ${EMAIL_API_URL:https://api.resend.com/emails}
    api-key: ${EMAIL_API_KEY:}
    from: ${EMAIL_FROM:}
    poll-interval-ms: ${EMAIL_POLL_INTERVAL_MS:5000}
  storage:
    bucket: ${S3_BUCKET:}
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
